<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account | ShopEase</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .register-container {
            width: 420px;
            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;

            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 18px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #4f46e5;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 10px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;
        }

        .login-link {
            text-align: center;

            margin-top: 20px;

            color: #6b7280;
        }

        .login-link a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="register-container">

    <div class="logo">
        🛍️ ShopEase
    </div>

    <div class="subtitle">
        Create your account
    </div>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            placeholder="Enter email"
            required
        >

        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Create password"
            required
        >

        <button type="submit">
            Create Account
        </button>

    </form>

    <div class="login-link">

        Already have an account?

        <a href="#">
            Login
        </a>

    </div>

</div>

</body>

</html>
