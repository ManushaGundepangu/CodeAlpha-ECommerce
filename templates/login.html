<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | ShopEase</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: white;

            padding: 40px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            text-align: center;

            font-size: 30px;
            font-weight: bold;

            margin-bottom: 8px;
        }

        .welcome {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        .error {
            background: #fee2e2;

            color: #b91c1c;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 15px;

            margin-bottom: 20px;
        }

        input:focus {
            outline: none;

            border-color: #4f46e5;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .register {
            text-align: center;

            margin-top: 25px;

            color: #6b7280;
        }

        .register a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .back-home {
            display: block;

            text-align: center;

            margin-top: 15px;

            color: #6b7280;

            text-decoration: none;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        🛍️ ShopEase
    </div>

    <div class="welcome">
        Welcome back! Please login to continue.
    </div>


    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Username
        </label>

        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >


        <label>
            Password
        </label>

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <div class="register">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>


    <a href="{% url 'home' %}" class="back-home">
        ← Back to ShopEase
    </a>

</div>

</body>

</html>
