<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout - ShopEase</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            color: #222;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 50px auto;
        }

        h1 {
            margin-bottom: 30px;
        }

        .checkout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .box h2 {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        .place-order {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        .place-order:hover {
            background: #333;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .total {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .checkout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Checkout</h1>

    <div class="checkout">

        <!-- CUSTOMER INFORMATION -->

        <div class="box">

            <h2>Delivery Information</h2>

            <form method="POST">

                {% csrf_token %}

                <label>Full Name</label>
                <input
                    type="text"
                    name="full_name"
                    required
                    placeholder="Enter your full name"
                >

                <label>Email</label>
                <input
                    type="email"
                    name="email"
                    required
                    placeholder="Enter your email"
                >

                <label>Phone</label>
                <input
                    type="tel"
                    name="phone"
                    required
                    placeholder="Enter your phone number"
                >

                <label>Address</label>
                <textarea
                    name="address"
                    required
                    placeholder="Enter your delivery address"
                ></textarea>

                <label>City</label>
                <input
                    type="text"
                    name="city"
                    required
                    placeholder="Enter your city"
                >

                <button type="submit" class="place-order">
                    Place Order
                </button>

            </form>

        </div>


        <!-- ORDER SUMMARY -->

        <div class="box">

            <h2>Order Summary</h2>

            {% for item in cart_items %}

            <div class="item">

                <div>
                    <strong>{{ item.product.name }}</strong>
                    <br>
                    Quantity: {{ item.quantity }}
                </div>

                <div>
                    ₹{{ item.total_price }}
                </div>

            </div>

            {% endfor %}

            <div class="total">
                <span>Total</span>
                <span>₹{{ total }}</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
